<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport"
        content="width=device-width,user-scaleble=yes,initial-scale=1.0,maximum-scale=2.0,minimum-scale=1.0">
    <title>football</title>
</head>

<body>
    <header>
        <div class="header">
            <div class="wrapper flex-between ">
                <div class="logo">
                    <a href="index.html">
                        <img src="img/meinlogosvg.png" alt="logo footboll">
                    </a>
                </div>
                <div class="dark-bgc"></div>
                <ul class="menu">
                    <li><a class="btn-grey" href="#">ПРО НАС</a></li>
                    <li><a class="btn-grey" href="#">КОНТАКТИ</a></li>
                    <li><a class="btn-grey" href="#">ІВЕНТИ</a></li>
                    <li><a class="btn-grey" href="#">ГРУПИ</a></li>
                    <li class="cancel">x</li>
                </ul>
                <a href="#" class=" number flex-between item-centre">
                    <img class="phon" src="img/phonesvg.svg" alt="phone">
                    +38 050 505 50 55
                </a>
                <div class="dark-bgc"></div>
                <div class="burger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="main wrapper">
            <div>
                <div>
                    <p><i>Знайди свій рівень. Тренуйся як профі</i></p>
                    <h1 class="text">Професійні заняття з
                        футболу в
                        Хмельницькому</h1>
                    <p class="footb">Почни свій футбольний шлях!</p>
                    <div class="baton">
                        <a class="btn" href="#">Записатись на заняття</a>
                    </div>
                    <p class="zirocka">
                        <img src="img/zirocka.svg" alt="zirocka">
                        1.200+ задоволених учнів
                    </p>
                </div>
            </div>
        </div>
        <div class="img">
            <img src="img/photoball.png" alt="мяч">
        </div>
    </main>
    <footer>
        <div class="footer">
            <div class="wrapper flex-between item-centre">
                <div class="graphic">
                    <p class="hour">Пн-Пт: 8-20:00</p>
                    <p class="hour">Сб-Нд: 10-19:00</p>
                </div>
                <ul class="social flex-between">
                    <li class="geo"><a class="cor" href="#"><img src="img/geo.svg" alt="geo"></a></li>
                    <li class="inst"><a href="#"><img src="img/inst.svg" alt="inst"></a></li>
                    <li class="tg"><a href="#"><img src="img/tg.svg" alt="tg"></a></li>
                </ul>
                <div class="logoanrik">
                    <div class="footrelogo">
                        <p class="item-size">
                            <a class="logo-foot" href="#">
                                <img src="img/logofooter.png" alt="logo-foot">
                            </a>
                        </p>
                        <p class="time">
                            sinse 2025
                        </p>
                    </div>
                </div>
            </div>
    </footer>
    <script>
        const dark = document.querySelector(".dark-bgc"),
            burger = document.querySelector(".burger"),
            menu = document.querySelector(".menu"),
            cancel = document.querySelector(".cancel")

        burger.addEventListener("click", function () {
            menu.style.left = "0";
            dark.style.display = "block"
        })

        function cancelBurger() {
            menu.style.left = "-100%";
            dark.style.display = "none"
        }
        cancel.addEventListener("click", cancelBurger)
        dark.addEventListener("click", cancelBurger)
    </script>
</body>

</html>
